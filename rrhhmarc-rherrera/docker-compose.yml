version: '3.9'

services:
  database:
    image: postgres:16-alpine
    container_name: rrhh_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rrhh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: rrhh_api
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - rrhh_network

  web:
    build: ./web
    container_name: rrhh_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8090:80"
    networks:
      - rrhh_network

networks:
  rrhh_network:
    driver: bridge

volumes:
  db_data: